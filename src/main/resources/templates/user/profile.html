<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="ISO-8859-1">
    <title>My Profile</title>
</head>
<body>
<section>
    <div class="container-fluid mt-5 p-5 bg-light">
        <div class="row">
            <div class="col-md-10 offset-md-1">

                <p class="fs-3 text-center">My Profile</p>

                <!-- Session Messages -->
                <th:block th:if="${session.succMsg}">
                    <p class="text-success fw-bold text-center">[[${session.succMsg}]]</p>
                    <th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
                </th:block>

                <th:block th:if="${session.errorMsg}">
                    <p class="text-danger fw-bold text-center">[[${session.errorMsg}]]</p>
                    <th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
                </th:block>

                <hr>

                <!-- Profile Image -->
                <div class="text-center">
                    <img alt="Profile Image"
                         th:src="${user != null && user.profileImage != null ? user.profileImage : '/img/profile_img/default.png'}"
                         class="border p-2" style="width: 110px; height: 110px; border-radius: 50%;">
                </div>

                <div class="col-md-8 offset-md-2 mt-4">
                    <table class="table table-borderless">
                        <tbody>
                        <form action="/user/update-profile" method="post" enctype="multipart/form-data">
                            <tr>
                                <th scope="row">Name</th>
                                <td>:</td>
                                <td><input type="text" name="name" class="form-control"
                                           th:value="${user != null && user.name != null ? user.name : ''}"></td>
                            </tr>
                            <tr>
                                <th scope="row">Mobile Number</th>
                                <td>:</td>
                                <td><input type="text" name="mobileNumber" class="form-control"
                                           th:value="${user != null && user.mobileNumber != null ? user.mobileNumber : ''}"></td>
                            </tr>
                            <tr>
                                <th scope="row">Email</th>
                                <td>:</td>
                                <td><input type="text" class="form-control" readonly
                                           th:value="${user != null && user.email != null ? user.email : ''}"></td>
                            </tr>
                            <tr>
                                <th scope="row">Address</th>
                                <td>:</td>
                                <td><input type="text" name="address" class="form-control"
                                           th:value="${user != null && user.address != null ? user.address : ''}"></td>
                            </tr>
                            <tr>
                                <th scope="row">City</th>
                                <td>:</td>
                                <td><input type="text" name="city" class="form-control"
                                           th:value="${user != null && user.city != null ? user.city : ''}"></td>
                            </tr>
                            <tr>
                                <th scope="row">State</th>
                                <td>:</td>
                                <td><input type="text" name="state" class="form-control"
                                           th:value="${user != null && user.state != null ? user.state : ''}"></td>
                            </tr>
                            <tr>
                                <th scope="row">Pincode</th>
                                <td>:</td>
                                <td><input type="text" name="pincode" class="form-control"
                                           th:value="${user != null && user.pincode != null ? user.pincode : ''}"></td>
                            </tr>
                            <tr>
                                <th scope="row">Image</th>
                                <td>:</td>
                                <td><input type="file" name="img" class="form-control"></td>
                            </tr>
                            <tr>
                                <th scope="row">Role</th>
                                <td>:</td>
                                <td><input type="text" class="form-control" readonly
                                           th:value="${user != null && user.role != null ? user.role : '-'}"></td>
                            </tr>
                            <tr>
                                <th scope="row">Account Status</th>
                                <td>:</td>
                                <td>
                                    <input type="text" class="form-control" readonly
                                           th:value="${user != null && user.isEnable != null ? user.isEnable : '-'}">
                                    <input type="hidden" name="id" th:value="${user != null ? user.id : 0}">
                                </td>
                            </tr>
                            <tr>
                                <td></td>
                                <td class="text-center">
                                    <button class="btn btn-sm bg-primary text-light">Update</button>
                                </td>
                            </tr>
                        </form>
                        </tbody>
                    </table>
                </div>
            </div>

            <hr>
            <div class="col-md-10 offset-md-1 mt-1">
                <div class="row">
                    <p class="text-center fs-3">Change Password</p>
                    <div class="col-md-6 offset-md-3">
                        <table class="table table-borderless">
                            <tbody>
                            <form action="/user/change-password" method="post">
                                <tr>
                                    <th scope="row">Current Password</th>
                                    <td><input type="password" name="currentPassword" class="form-control"></td>
                                </tr>
                                <tr>
                                    <th scope="row">New Password</th>
                                    <td><input type="password" name="newPassword" class="form-control"></td>
                                </tr>
                                <tr>
                                    <th scope="row">Confirm Password</th>
                                    <td><input type="password" name="confirmPassword" class="form-control"></td>
                                </tr>
                                <tr>
                                    <td></td>
                                    <td class="text-center">
                                        <button class="btn btn-sm bg-primary text-light col-md-4">Update</button>
                                    </td>
                                </tr>
                            </form>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>
</body>
</html>
