<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="ISO-8859-1">
<title>Products</title>
</head>
<body>
<section>

    <!-- SEARCH BAR -->
    <div class="container-fluid bg-primary p-5 mt-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <form action="/products" method="get">
                    <div class="input-group">
                        <input type="text"
                               class="form-control"
                               name="ch"
                               placeholder="Search products..."
                               th:value="${param.ch}">
                        <button class="btn btn-light text-dark ms-3 col-md-2">
                            <i class="fa-solid fa-magnifying-glass"></i> Search
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="container-fluid mt-1">
        <div class="row">

            <!-- CATEGORY -->
            <div class="col-md-2 p-0">
                <div class="card shadow-sm mb-5 bg-body-tertiary rounded">
                    <div class="card-body">
                        <div class="list-group">
                            <p class="fs-5">Category</p>

                            <a th:href="@{/products}"
                               th:classappend="${param.category == null} ? 'active' : ''"
                               class="list-group-item list-group-item-action">
                                All
                            </a>

                            <a th:each="c:${categories}"
                               th:href="@{'/products?category=' + ${c.name}}"
                               th:classappend="${param.category == c.name} ? 'active' : ''"
                               class="list-group-item list-group-item-action">
                                [[${c.name}]]
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PRODUCTS -->
            <div class="col-md-10">
                <div class="card shadow-sm p-3 mb-5 bg-body-tertiary rounded">
                    <div class="card-body">

                        <p class="fs-3 text-center">Products</p>

                        <div class="row">

                            <th:block th:if="${productsSize > 0}">
                                <div class="col-md-3 mb-3" th:each="p:${products}">
                                    <div class="card h-100">
                                        <div class="card-body text-center">

                                            <img th:if="${p.image != null}"
                                                 th:src="${p.image}"
                                                 width="100%" height="150"
                                                 alt="Product Image">

                                            <p class="fs-5 mt-2">[[${p.title}]]</p>

                                            <p class="fw-bold">
                                                <th:block th:utext="${@commnServiceImpl.rupeeSign()}"></th:block>
                                                [[${p.discountPrice}]]
                                                <br>
                                                <span class="text-decoration-line-through text-secondary">
                                                    <th:block th:utext="${@commnServiceImpl.rupeeSign()}"></th:block>
                                                    [[${p.price}]]
                                                </span>
                                                <span class="text-success">
                                                    [[${p.discount}]]% off
                                                </span>
                                            </p>

                                            <a th:href="@{'/product/' + ${p.id}}"
                                               class="btn btn-primary btn-sm">
                                                View Details
                                            </a>

                                        </div>
                                    </div>
                                </div>
                            </th:block>

                            <th:block th:unless="${productsSize > 0}">
                                <p class="fs-4 text-center mt-4 text-danger">
                                    Product not available
                                </p>
                            </th:block>

                        </div>
                    </div>
                </div>

                <!-- PAGINATION -->
                <div class="row">
                    <div class="col-md-4">
                        Total Products : [[${totalElements}]]
                    </div>

                    <div class="col-md-6">
                        <th:block th:if="${productsSize > 0}">
                            <nav>
                                <ul class="pagination">

                                    <li class="page-item"
                                        th:classappend="${isFirst} ? 'disabled' : ''">
                                        <a class="page-link"
                                           th:href="@{'/products?pageNo=' + ${pageNo-1}}">&laquo;</a>
                                    </li>

                                    <li class="page-item"
                                        th:each="i : ${#numbers.sequence(1,totalPages)}"
                                        th:classappend="${pageNo+1 == i} ? 'active' : ''">
                                        <a class="page-link"
                                           th:href="@{'/products?pageNo=' + ${i-1}}">
                                            [[${i}]]
                                        </a>
                                    </li>

                                    <li class="page-item"
                                        th:classappend="${isLast} ? 'disabled' : ''">
                                        <a class="page-link"
                                           th:href="@{'/products?pageNo=' + ${pageNo+1}}">&raquo;</a>
                                    </li>

                                </ul>
                            </nav>
                        </th:block>
                    </div>
                </div>

            </div>
        </div>
    </div>

</section>
</body>
</html>
