<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | E-Commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Include your base layout fragment -->
    <section th:replace="~{base::layout(~{::section})}">
        <div class="container mt-5 p-3">
            <div class="row">
                <!-- Left Image -->
                <div class="col-md-6 mb-3">
                    <img src="/img/ecom.png" alt="E-Commerce" class="img-fluid" style="height: 400px; width: 100%;">
                </div>

                <!-- Reset Password Form -->
                <div class="col-md-6 mb-3">
                    <div class="card shadow p-3 mb-5 rounded">
                        <div class="card-header">
                            <p class="fs-4 text-center">Reset Password</p>

                            <!-- Success Message -->
                            <th:block th:if="${session.succMsg}">
                                <p class="text-success fw-bold text-center">[[${session.succMsg}]]</p>
                            </th:block>

                            <!-- Error Message -->
                            <th:block th:if="${session.errorMsg}">
                                <p class="text-danger fw-bold text-center">[[${session.errorMsg}]]</p>
                            </th:block>
                        </div>

                        <div class="card-body">
                            <form th:action="@{/reset-password}" method="post" id="resetPassword">
                                <div class="mb-3">
                                    <label class="form-label" for="pass">New Password</label>
                                    <input type="password" class="form-control" id="pass" name="password" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label" for="confirmPassword">Confirm Password</label>
                                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                                </div>

                                <!-- Token hidden field -->
                                <input type="hidden" th:value="${token}" name="token">

                                <button type="submit" class="btn btn-primary w-100">Reset Password</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
