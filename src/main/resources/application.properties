spring.datasource.url=jdbc:mysql://${MYSQL_HOST:your_host.ap-south-1.rds.amazonaws.com}:3306/${MYSQL_DB:DB_NAME}
spring.datasource.username=${MYSQL_USERNAME:YOUR_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD:YOUR_PASSWORD}
spring.jpa.properties.hibernate.dialect=${MYSQL_DIALECT:org.hibernate.dialect.MariaDBDialect}
spring.jpa.hibernate.ddl-auto=${MYSQL_DDL:update}

#spring.main.allow-circular-references=true

spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.username=${EMAIL_USERNAME:EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD:EMAIL_PASSWORD}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

aws.access.key=${S3_ACCESS_KEY:YOUR_S3_ACCESS_KEY}
aws.secret.key=${S3_SECRET_KEY:YOUR_S3_SECRET_KEY}
aws.region=${AWS_REGION:ap-south-1}
aws.s3.bucket.category=${S3_CATEGORY_BUCKET:my-cart-category}
aws.s3.bucket.product=${S3_PRODUCT_BUCKET:my-cart-product}
aws.s3.bucket.profile=${S3_PROFILE_BUCKET:my-cart-profile}

server.port=${PORT:5000}
rupee.sign=${RUPEE_SIGN:&#8364;}



